[project]
name = "kora"
version = "0.1.0"
description = "KORA - Knowledge Oriented Retrieval Assistant (UV-based, Ollama + Granite 3.3:2b, Docling RAG)"
requires-python = ">=3.10"
readme = "README.md"
license = "LGPL-3.0"
authors = [
  { name = "Kenneth (Alex) Jenkins" }
]

dependencies = [
  "gradio>=4.44.0",
  "faiss-cpu>=1.8.0.post1",
  "numpy>=1.26",
  "scikit-learn>=1.4.0",
  "httpx>=0.27.0",
  "docling>=2.0.0",
  "sentence-transformers>=3.0.1",
  "cryptography>=41.0.0",
  "fastapi>=0.104.0",
  "uvicorn>=0.24.0",
  "pydantic>=2.0.0",
  "prisma>=0.11.0",
  "aiosqlite>=0.19.0",
  "tabulate>=0.9.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
]

[tool.uv]
index-url = "https://pypi.org/simple"

[project.scripts]
kora-launch = "kora.launcher:main"
kora-auth = "kora.auth_cli:main"
kora-api = "kora.api_launcher:main"
kora-hide = "kora.obfuscate_cli:main"
kora-admin = "kora.admin_ui:main"
kora-logs = "kora.logs_viewer:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kora"]

[tool.pytest.ini_options]
filterwarnings = [
  "ignore::DeprecationWarning:easyocr.*",
  "ignore::DeprecationWarning:torch.*",
  "ignore:builtin type.*has no __module__ attribute:DeprecationWarning",
  "ignore:'mode' parameter is deprecated.*:DeprecationWarning",
  "ignore:'pin_memory' argument is set as true but no accelerator is found.*:UserWarning",
]
